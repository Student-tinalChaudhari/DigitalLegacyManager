<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - Digital Legacy Manager
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        .register-card {

            max-width: 500px;

            margin: 50px auto;

            background: #ffffff;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.10);

        }


        .register-card h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        .register-card p {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }


        .register-card label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: 600;

        }


        .register-card input {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

        }


        .register-button {

            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

        }


        .login-link {

            text-align: center;

            margin-top: 20px;

        }


        .login-link a {

            text-decoration: none;

            font-weight: 600;

        }


        .message {

            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 15px;

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        🔐 Digital Legacy Manager
    </div>

</nav>


<div class="register-card">

    <h1>
        📝 Create Account
    </h1>

    <p>
        Create a secure Digital Legacy Manager account.
    </p>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        action="{{ url_for('register') }}"
        method="POST"
    >


        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="8"
            required
        >


        <label for="confirm_password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm your password"
            minlength="8"
            required
        >


        <button
            type="submit"
            class="primary-btn register-button"
        >
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</div>


<footer>
    © 2026 Digital Legacy Manager
</footer>


</body>

</html>
