<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Verify 2FA - Digital Legacy Manager
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🔐 Digital Legacy Manager
    </div>

</nav>

<div class="dashboard">

    <div class="form-card">

        <h1>
            🔐 Two-Factor Verification
        </h1>

        <p>
            Enter the 6-digit code from your authenticator app.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="empty">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>
                Authentication Code
            </label>

            <input
                type="text"
                name="otp"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                placeholder="Enter 6-digit code"
                required
            >

            <button
                type="submit"
                class="primary-btn"
            >
                Verify & Login
            </button>

        </form>

    </div>

</div>

<footer>
    © 2026 Digital Legacy Manager
</footer>

</body>

</html>
